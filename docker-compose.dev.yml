services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: ${DB_NAME:-test_db}
        ports:
            - "${DB_PORT:-3306}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
            interval: 10s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7.4-alpine
        ports:
            - "${REDIS_PORT:-6379}:6379"
        command: ["redis-server", "--save", "", "--appendonly", "no"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10

    otel-lgtm:
        image: grafana/otel-lgtm:0.21.0
        ports:
            - "${GRAFANA_PORT:-3001}:3000"
            - "${LOKI_PORT:-3100}:3100"
            - "${TEMPO_PORT:-3200}:3200"
            - "${OTLP_GRPC_PORT:-4317}:4317"
            - "${OTLP_HTTP_PORT:-4318}:4318"
            - "${PROMETHEUS_PORT:-9090}:9090"

volumes:
    mysql_data:
