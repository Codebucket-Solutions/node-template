services:
    mysql:
        image: mysql:8.4
        container_name: node-template-mysql
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: test_db
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
            interval: 10s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7.4-alpine
        container_name: node-template-redis
        ports:
            - "6379:6379"
        command: ["redis-server", "--save", "", "--appendonly", "no"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10

    otel-lgtm:
        image: grafana/otel-lgtm:0.21.0
        container_name: node-template-otel-lgtm
        ports:
            - "3001:3000"
            - "3100:3100"
            - "3200:3200"
            - "4317:4317"
            - "4318:4318"
            - "9090:9090"

volumes:
    mysql_data:
